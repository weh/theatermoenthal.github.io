title: Alles für de Papst
subtitle: Schwank in zwei Akten
authors:
  - Atréju Diener
  - Enrico Maurer
season: Januar 2027
poster: images/vorhang.png
headline: Vorhang auf für das Chaos.
note: Mir freued üs uf eu! ↗
description: >-
  Eine Tür geht auf, eine Tür fällt zu – und hinter der Bühne läuft alles
  komplett aus dem Ruder. Erlebt einen Abend voller Tempo, Verwechslungen und
  ziemlich vieler Sardinen.
